<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>爆仓模拟器 · 戒赌主题股市小游戏</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
         background:#101318; color:#e8e8e8; font-size:14px; }
  #app { max-width:640px; margin:0 auto; padding:10px 10px 120px; }
  .hidden { display:none !important; }

  /* 顶部信息栏 */
  #topbar { display:flex; justify-content:space-between; align-items:center;
            background:#1a1f27; border-radius:10px; padding:10px 12px; margin-bottom:10px; }
  #topbar .day { font-size:16px; font-weight:bold; color:#f0b90b; }
  #topbar .money { font-size:15px; }
  #tiltbar-wrap { margin-top:6px; }
  #tiltbar { height:8px; background:#2a2f3a; border-radius:4px; overflow:hidden; }
  #tiltfill { height:100%; width:20%; border-radius:4px;
              background:linear-gradient(90deg,#4caf50,#f0b90b,#f44336); transition:width .4s; }
  .tilt-label { font-size:12px; color:#9aa0aa; margin-top:3px; }

  /* 提示条 */
  #newsflash { background:#1a1f27; border-left:3px solid #f0b90b; border-radius:6px;
               padding:8px 10px; margin-bottom:10px; font-size:13px; min-height:20px; }

  /* K线图 */
  #chartbox { background:#1a1f27; border-radius:10px; padding:10px; margin-bottom:10px; }
  #chartbox .chart-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  #chartbox .chart-head .nm { font-size:15px; font-weight:bold; }
  #chartbox .chart-head .pc { font-size:14px; }
  .up { color:#f44336; } .down { color:#4caf50; } .flat { color:#9aa0aa; }
  canvas { width:100%; display:block; background:#0d1015; border-radius:6px; }

  /* 板块列表：自选股样式 */
  #sectors { margin-bottom:10px; }
  .sector { display:flex; align-items:center; gap:10px; padding:10px 8px; cursor:pointer;
            border-bottom:1px solid #232833; border-radius:8px; }
  .sector.selected { background:#1a1f27; }
  .sector .sleft { flex:1; min-width:0; }
  .sector .sname { font-weight:bold; font-size:16px; color:#fff; }
  .sector .ssub { font-size:12px; color:#8a919c; margin-top:2px; white-space:nowrap;
                   overflow:hidden; text-overflow:ellipsis; }
  .sector canvas.spark { width:88px; height:40px; flex:none; }
  .sector .sright { text-align:right; flex:none; }
  .sector .sprice { font-size:16px; color:#fff; }
  .sector .pill { display:inline-block; min-width:64px; text-align:center; margin-top:3px;
                  padding:3px 8px; border-radius:6px; font-size:13px; color:#fff; }
  .pill.up { background:#d32f2f; } .pill.down { background:#1d9e75; } .pill.flat { background:#3a4152; }
  .sector .heat { height:4px; background:#2a2f3a; border-radius:2px; margin-top:5px; overflow:hidden; width:110px; margin-left:auto; }
  .sector .heat > div { height:100%; background:linear-gradient(90deg,#2196f3,#f0b90b,#f44336); }
  .limitdown-tag { color:#26a69a; font-size:11px; font-weight:bold; }

  /* 交易面板 */
  #trade { background:#1a1f27; border-radius:10px; padding:10px; margin-bottom:10px; }
  #trade .t-title { font-weight:bold; margin-bottom:8px; }
  #trade .hold { font-size:12px; color:#9aa0aa; margin-bottom:8px; }
  .btnrow { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
  button { border:none; border-radius:8px; padding:9px 12px; font-size:13px;
           cursor:pointer; color:#fff; background:#2a2f3a; }
  button:active { transform:scale(.96); }
  .buy { background:#c62828; } .sell { background:#2e7d32; }
  .primary { background:#f0b90b; color:#111; font-weight:bold; }
  .danger { background:#b71c1c; }
  button:disabled { opacity:.4; }

  /* 底部固定操作栏 */
  #actionbar { position:fixed; left:0; right:0; bottom:0; background:#141920;
               border-top:1px solid #2a2f3a; padding:10px; display:flex; gap:8px;
               max-width:640px; margin:0 auto; }
  #actionbar button { flex:1; padding:12px; font-size:15px; }

  /* 弹窗 */
  .modal-mask { position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:50;
                display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal { background:#1e242e; border-radius:14px; padding:20px; max-width:420px;
           width:100%; max-height:85vh; overflow-y:auto; }
  .modal h3 { margin:0 0 10px; color:#f0b90b; }
  .modal p { line-height:1.7; margin:8px 0; }
  .modal .btnrow { margin-top:14px; }

  /* 开始界面 */
  #start-screen { min-height:90vh; display:flex; flex-direction:column; justify-content:center;
                  text-align:center; padding:24px; }
  #start-screen h1 { font-size:34px; margin:0 0 6px; color:#f0b90b; }
  #start-screen .sub { color:#9aa0aa; margin-bottom:20px; }
  #start-screen input { width:100%; padding:12px; border-radius:8px; border:1px solid #2a2f3a;
                        background:#1a1f27; color:#fff; font-size:15px; margin-bottom:10px; text-align:center; }
  .disclaimer { font-size:12px; color:#6b7280; margin:14px 0; line-height:1.7; }

  /* 上头特效 */
  body.tilted #app { animation:shake .5s infinite; }
  body.tilted #topbar { border:1px solid #f44336; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(1.5px)} 75%{transform:translateX(-1.5px)} }

  .poster { background:#0d1015; border:2px dashed #f0b90b; border-radius:10px;
            padding:16px; text-align:center; margin:12px 0; }
  .poster .big { font-size:22px; font-weight:bold; color:#f44336; margin:8px 0; }
  .achieve { display:inline-block; background:#2a2f3a; border-radius:20px; padding:4px 12px;
             font-size:12px; margin:3px; }
</style>

<body>
<div id="app">

  <!-- 开始界面 -->
  <div id="start-screen">
    <h1>💥 爆仓模拟器</h1>
    <div class="sub">一款戒赌主题的 A 股模拟游戏</div>
    <input id="player-name" placeholder="输入你的名字（比如：韭菜本菜）" maxlength="12">
    <input id="seed-input" placeholder="行情种子（留空随机；和朋友用同一串可同场竞技）" maxlength="20">
    <button class="primary" style="width:100%;padding:14px;font-size:16px" onclick="startGame()">开 始 炒 股</button>
    <button id="resume-btn" class="hidden" style="width:100%;padding:12px;font-size:15px;margin-top:8px" onclick="resumeGame()">▶️ 继续上次对局</button>
    <div class="disclaimer">
      本游戏纯属虚构，所有行情由随机数生成，不构成任何投资建议。<br>
      游戏想告诉你的是：<b>赌徒心态 + 杠杆 = 爆仓</b>，现实中请远离赌博与非法配资。
    </div>
  </div>

  <!-- 游戏主界面 -->
  <div id="game-screen" class="hidden">
    <div id="topbar">
      <div>
        <div class="day" id="day-label">第 1 / 30 天</div>
        <div class="tilt-label">😤 上头值 <span id="tilt-num">20</span></div>
        <div id="tiltbar-wrap"><div id="tiltbar"><div id="tiltfill"></div></div></div>
      </div>
      <div style="text-align:right">
        <div class="money">💰 总资产 <b id="equity-label">100000</b></div>
        <div class="tilt-label">现金 <span id="cash-label">100000</span></div>
        <div class="tilt-label" id="debt-label" style="color:#f44336"></div>
      </div>
    </div>

    <div id="newsflash">📻 欢迎来到 A 股。记住：你看到的"热点"，都是别人出货的出口。</div>

    <div id="chartbox">
      <div class="chart-head">
        <span class="nm" id="chart-name">银行红利</span>
        <span class="pc" id="chart-pct">--</span>
      </div>
      <canvas id="chart" height="180"></canvas>
    </div>

    <div id="sectors"></div>

    <div id="trade">
      <div class="t-title" id="trade-title">交易 · 银行红利</div>
      <div class="hold" id="trade-hold"></div>
      <div class="btnrow" id="buy-btns"></div>
      <div class="btnrow" id="sell-btns"></div>
    </div>

    <div id="actionbar">
      <button class="primary" onclick="nextDay()">⏭ 下一天</button>
      <button id="margin-btn" onclick="openMarginShop()" disabled>🏦 配资公司 🔒</button>
    </div>
  </div>
</div>

<div id="modal-root"></div>
<script>
'use strict';
/* ============ 工具：可播种随机数 ============ */
function mulberry32(seed){ return function(){ let t = seed += 0x6D2B79F5;
  t = Math.imul(t ^ (t>>>15), t|1); t ^= t + Math.imul(t ^ (t>>>7), t|61);
  return ((t ^ (t>>>14)) >>> 0) / 4294967296; }; }
function hashSeed(str){ let h = 2166136261; for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

let rng = Math.random;
function randn(){ let u=0, v=0; while(!u) u=rng(); while(!v) v=rng();
  return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v); }
function pick(arr){ return arr[Math.floor(rng()*arr.length)]; }

/* ============ 板块定义（照搬 A 股八大板块性格） ============ */
const SECTORS = [
  { id:'bank',   name:'银行红利', sub:'工商银行 · 建设银行 · 农业银行', sigma:0.012, limit:0.10, dividend:true,  desc:'无聊，但活得久。每10天发股息。' },
  { id:'ai',     name:'AI算力',   sub:'光模块 · 半导体 · AI服务器', sigma:0.050, limit:0.20, dividend:false, desc:'叙事之王，拥挤之王。20cm。' },
  { id:'ne',     name:'新能源',   sub:'锂电池 · 光伏 · 储能', sigma:0.035, limit:0.10, dividend:false, desc:'政策敏感，补贴与产能过剩之间横跳。' },
  { id:'med',    name:'医药',     sub:'创新药 · 医疗器械 · CXO', sigma:0.028, limit:0.10, dividend:false, desc:'平时温吞，集采一来单日暴击。' },
  { id:'baijiu', name:'白酒消费', sub:'贵州茅台 · 五粮液 · 消费龙头', sigma:0.022, limit:0.10, dividend:false, desc:'跟着经济预期慢涨慢跌。' },
  { id:'broker', name:'券商',     sub:'中信证券 · 华泰证券 · 牛市旗手', sigma:0.040, limit:0.10, dividend:false, desc:'牛市旗手，市场涨跌它都放大2倍。' },
  { id:'estate', name:'地产',     sub:'万科 · 保利发展 · 地产链', sigma:0.025, limit:0.10, dividend:false, desc:'长期趴着，救市政策一出连拉涨停。' },
  { id:'mil',    name:'军工',     sub:'航空发动机 · 航天 · 船舶', sigma:0.045, limit:0.10, dividend:false, desc:'地缘新闻驱动，来得快去得更快。' },
];
function S(id){ return SECTORS.find(s=>s.id===id); }

/* 开局前生成约3个月历史走势：让每个板块有"前史"，玩家可以先研究再下单（然后被现实教育） */
const PRE_DAYS = 90;
function genHistory(s){
  let p = 100 * (0.72 + rng()*0.55);
  const closes = [p];
  let drift = (rng()-0.5)*0.004;
  for (let i=1; i<PRE_DAYS; i++){
    if (rng() < 0.07) drift = (rng()-0.5)*0.007;   // 趋势 regime 切换
    let r = drift + s.sigma*randn();
    r = Math.max(-s.limit, Math.min(s.limit, r));
    p *= (1+r); closes.push(p);
  }
  const scale = 100 / closes[PRE_DAYS-1];           // 归一化：昨日收盘 = 100，与开局价衔接
  const candles = [];
  for (let i=0; i<PRE_DAYS; i++){
    const c0 = closes[i]*scale;
    const o0 = i===0 ? c0/(1+(rng()-0.5)*s.sigma) : closes[i-1]*scale;
    const sw = s.sigma*Math.abs(randn())*0.9 + Math.abs(c0-o0)/c0*0.25;
    candles.push({ o:o0, h:Math.max(o0,c0)*(1+sw*0.5), l:Math.min(o0,c0)*(1-sw*0.5),
                   c:c0, v: 40+rng()*60+Math.abs(c0-o0)/Math.max(1,c0)*900, pre:true });
  }
  return candles;
}

/* ============ 游戏状态 ============ */
const DAYS = 30, FEE = 0.001;
let G = null;

function newGame(seedStr){
  rng = mulberry32(hashSeed(seedStr || 'default'));
  const prices={}, histories={}, heat={}, hold={}, ohlc={}, lastChange={};
  // 初始热度照搬 2026 年 10 月的真实格局：AI 拥挤见顶、红利低位
  const initHeat = { ai:30, broker:14, ne:12, med:10, baijiu:10, bank:10, mil:8, estate:6 };
  SECTORS.forEach(s=>{
    const pre = genHistory(s);
    ohlc[s.id] = pre;
    histories[s.id] = pre.map(k=>k.c);
    prices[s.id] = 100;
    heat[s.id] = initHeat[s.id];
    hold[s.id] = { shares:0, boughtToday:0, avgCost:0 };
    const last = pre[pre.length-1], prev = pre[pre.length-2];
    lastChange[s.id] = (last.c - prev.c)/prev.c;
  });
  return {
    seed: seedStr, day:1, cash:100000, tilt:20, debt:0,
    prices, histories, heat, hold, ohlc, lastChange,
    limitDown:{},
    equityHist:[100000], lieHist:[100000],
    lieShares: 99900/100, lieCash: 100,   // 躺平线：第一天全仓银行红利
    margin:null, firstMarginRig:false, marginOpens:0,
    loanOffered:false, loanRefused:false, emptyDays:0,
    lastEquity:100000, over:false, log:[], trades:[],
  };
}

function equity(){ let e = G.cash - G.debt;
  SECTORS.forEach(s=>{ e += G.hold[s.id].shares * G.prices[s.id]; });
  if (G.margin) e += G.margin.shares * G.prices[G.margin.sector] - G.margin.borrowed;
  return e; }
function fmt(n){ return Math.round(n).toLocaleString('zh-CN'); }

/* ============ 行情引擎：存量资金跷跷板 ============ */
function flowHeat(){
  // 热度守恒=100：昨天的赢家吸引资金，但过度拥挤会被抽走
  const gains = SECTORS.map(s=>({ id:s.id, chg: G.lastChange[s.id] || 0 }));
  const totalPos = gains.reduce((a,g)=> a + Math.max(0, g.chg), 0) || 1;
  SECTORS.forEach(s=>{
    const g = G.lastChange[s.id] || 0;
    let flow = g / totalPos * 18;                       // 动量流入
    if (G.heat[s.id] > 26) flow -= (G.heat[s.id]-26) * 0.55;  // 拥挤出清
    if (G.heat[s.id] < 6)  flow += (6 - G.heat[s.id]) * 0.35; // 冷门回补
    flow += (rng()-0.5) * 3;                             // 随机游走
    G.heat[s.id] += flow;
  });
  // 二次配平到总和 100
  let sum = SECTORS.reduce((a,s)=> a + G.heat[s.id], 0);
  SECTORS.forEach(s=>{ G.heat[s.id] = Math.max(2, G.heat[s.id] * 100/sum); });
}

const EVENTS = [
  { w:3, text:'💧 央行降准！流动性放水。', shock:{ bank:0.03, broker:0.06, estate:0.04 } },
  { w:3, text:'🏭 产业扶持政策出台，钱给到新能源。', shock:{ ne:0.08, mil:0.02 } },
  { w:2, text:'🤖 AI 大模型新突破，算力板块沸腾。', shock:{ ai:0.09 } },
  { w:2, text:'💊 医保集采名单公布，医药板块哀鸿遍野。', shock:{ med:-0.22 } },
  { w:2, text:'🚀 创新药出海签下大单！', shock:{ med:0.13 } },
  { w:2, text:'🏠 重磅救市政策落地，地产链狂欢。', shock:{ estate:0.12, bank:0.02 } },
  { w:2, text:'🕊️ 地缘局势骤然紧张，军工拉升。', shock:{ mil:0.10 } },
  { w:2, text:'🍶 消费数据超预期，白酒走强。', shock:{ baijiu:0.06 } },
  { w:2, text:'⚠️ 监管点名炒作，AI 算力高位跳水。', shock:{ ai:-0.14 } },
  { w:2, text:'📊 三季报暴雷，某热门板块业绩不及预期。', shock:{ ne:-0.10, ai:-0.05 } },
  { w:2, text:'🐂 "牛市来了"冲上热搜，券商异动。', shock:{ broker:0.11 } },
  { w:2, text:'🌧️ 海外市场大跌，A股情绪受挫。', shock:{ ai:-0.06, broker:-0.05, ne:-0.04 } },
];
function rollEvent(){
  if (rng() > 0.38) return null;
  const total = EVENTS.reduce((a,e)=>a+e.w,0);
  let r = rng()*total;
  for (const e of EVENTS){ r -= e.w; if (r <= 0) return e; }
  return EVENTS[0];
}

function advanceDay(){
  /* 事件 */
  const ev = rollEvent();
  /* 热量流动 */
  flowHeat();
  /* 价格更新 */
  const mktHeat = SECTORS.reduce((a,s)=>a+G.heat[s.id],0)/8;
  SECTORS.forEach(s=>{
    let drift = (G.heat[s.id]-12.5)*0.0006;
    if (s.id==='broker') drift += (mktHeat-12.5)*0.0012;   // 牛市旗手：放大市场情绪
    let r = drift + s.sigma*randn();
    if (ev && ev.shock[s.id]) r += ev.shock[s.id];
    if (G.margin && G.margin.sector===s.id && G.firstMarginRig) r += 0.05; // 配资养鱼：第一次给甜头
    r = Math.max(-s.limit, Math.min(s.limit, r));
    const open = G.prices[s.id], closeP = open*(1+r);
    // 盘中最高/最低（影线）：由波动率和当日涨幅生成
    const swing = s.sigma*Math.abs(randn())*0.9 + Math.abs(r)*0.25;
    const high = Math.max(open,closeP)*(1+swing*0.5);
    const low  = Math.min(open,closeP)*(1-swing*0.5);
    const vol  = 40 + G.heat[s.id]*5 + Math.abs(r)*900 + rng()*40;  // 相对成交量
    G.prices[s.id] = closeP;
    G.ohlc[s.id].push({ o:open, h:high, l:low, c:closeP, v:vol });
    G.histories[s.id].push(G.prices[s.id]);
    G.lastChange[s.id] = r;
    G.limitDown[s.id] = (r <= -s.limit + 0.001);
    G.hold[s.id].boughtToday = 0;
  });
  if (G.firstMarginRig) G.firstMarginRig = false;
  /* 股息：每10天 */
  let divMsg = '';
  if (G.day % 10 === 0){
    const b = G.hold.bank;
    if (b.shares > 0){ const d = b.shares * G.prices.bank * 0.015; G.cash += d;
      divMsg = `💰 银行红利发股息 +${fmt(d)} 元（躺平的奖励）。`; }
    G.lieCash += G.lieShares * G.prices.bank * 0.015;
  }
  /* 躺平线 */
  G.lieHist.push(G.lieCash + G.lieShares * G.prices.bank);
  /* 上头值 */
  const eq = equity(); const pnl = (eq - G.lastEquity) / Math.max(1, G.lastEquity);
  let dt = 0;
  if (pnl < -0.03) dt = 15; else if (pnl < -0.01) dt = 8;
  else if (pnl > 0.02) dt = -8; else dt = -2;
  const posValue = SECTORS.reduce((a,s)=> a + G.hold[s.id].shares*G.prices[s.id], 0);
  if (posValue === 0 && !G.margin){ dt -= 6; G.emptyDays++; }
  G.tilt = Math.max(0, Math.min(100, G.tilt + dt));
  G.lastEquity = eq;
  G.equityHist.push(eq);
  G.day++;
  return { ev, divMsg, pnl };
}
</script>
<script>
'use strict';
/* ============ 交易（T+1 / 手续费 / 跌停卖不出） ============ */
let selected = 'bank';
let inspectIdx = -1;      // K线图点按查看的蜡烛序号
let chartGeom = null;     // drawChart 记录的几何信息，供点按换算
function flash(msg){ document.getElementById('newsflash').innerHTML = msg;}

function buy(id, amount){
const price = G.prices[id];
amount = Math.min(amount, G.cash);
if (amount < 100) return flash('💸 现金不够。');
const fee = amount*FEE, shares = (amount-fee)/price, h = G.hold[id];
h.avgCost = (h.avgCost*h.shares + price*shares) / (h.shares + shares);
h.shares += shares; h.boughtToday += shares; G.cash -= amount;
G.trades.push({ id, ki: PRE_DAYS + G.day - 1, t:'B', p: price });
flash(`📈 买入${fmt(amount)} 元（手续费 ${fmt(fee)}）。T+1，明天才能卖。`);
render();
}
function sell(id, frac){
const h = G.hold[id];
if (G.limitDown[id]) return flash(`🧊 跌停封死，卖不出去！想跑跑不掉。`);
const sellable = h.shares - h.boughtToday; // T+1
if (sellable <= 0) return flash('⏳ 今天买的今天不能卖（T+1），先拿着过夜吧。');
const shares = sellable * frac, gross = shares * G.prices[id], fee = gross*FEE;
h.shares -= shares; G.cash += gross - fee;
G.trades.push({ id, ki: PRE_DAYS + G.day - 1, t:'S', p: G.prices[id] });
flash(`📉 卖出回款 ${fmt(gross-fee)} 元（手续费 ${fmt(fee)}）。`);
render();
}

/* ============ 配资公司（拉爆杠杆的地方） ============ */
function showModal(html){
document.getElementById('modal-root').innerHTML =
`<div class="modal-mask"><div class="modal">${html}</div></div>`;
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; render();}

function openMarginShop(){
if (G.margin) return showModal(`<h3>🏦 配资公司</h3><p>老板：你已经在配资中了，先了结那笔再说。</p>
<div class="btnrow"><button onclick="closeModal()">离开</button></div>`);
const cash = G.cash;
showModal(`<h3>🏦 场外配资公司</h3>
<p>老板叼着烟：兄弟，看你骨骼惊奇。你这点钱炒股太慢了——<b>押上身家，老哥借你钱</b>，1:10 走起，财富自由就差一个涨停。</p>
<p>📜 规则：借的钱要还。亏到保证金一半触发<b>警戒线</b>，亏到只剩三成<b>强制平仓</b>。要是跌停卖不出去亏穿了——<b style="color:#f44336">倒欠我的钱，可别想跑</b>。</p>
<p>选板块：${SECTORS.map(s=>`<button onclick="marginPick('${s.id}')" style="margin:2px">${s.name}</button>`).join('')}</p>
<p>杠杆：<button onclick="marginLev(2)">1:2</button> <button onclick="marginLev(5)">1:5</button> <button onclick="marginLev(10)" class="danger">1:10 梭哈</button></p>
<p class="meta">本金默认用你全部现金 ${fmt(cash)} 元。选好板块和杠杆后点确认。</p>
<div class="btnrow"><button onclick="closeModal()">算了，我不借</button>
<button class="danger" onclick="confirmMargin()">签合同，借！</button></div>
<div id="margin-preview" style="color:#f0b90b"></div>`);
}
let marginChoice = { sector:'ai', lev:5};
function marginPick(id){ marginChoice.sector = id; previewMargin();}
function marginLev(l){ marginChoice.lev = l; previewMargin();}
function previewMargin(){
const p = G.cash, total = p * marginChoice.lev;
document.getElementById('margin-preview').innerText =
`📄 拟签：本金 ${fmt(p)}，借入 ${fmt(total-p)}，总仓位 ${fmt(total)} 买（1:${marginChoice.lev}）`;
}
function confirmMargin(){
const p = G.cash; if (p < 1000) return;
const lev = marginChoice.lev, total = p * lev, borrowed = total - p;
const price = G.prices[marginChoice.sector];
G.margin = { sector: marginChoice.sector, lev, principal: p, borrowed, shares: total*(1-FEE)/price};
G.trades.push({ id: marginChoice.sector, ki: PRE_DAYS + G.day - 1, t:'B', p: price });
G.cash = 0; G.marginOpens++;
if (G.marginOpens === 1) G.firstMarginRig = true; // 养鱼：第一次给甜头
closeModal(); flash(`🏦 配资签成！1:${lev} 仓位 ${fmt(total)} 砸进。老板笑着目送你离开。`);
}

function marginStatus(){
if (!G.margin) return null;
const m = G.margin;
const val = m.shares * G.prices[m.sector], eqv = val - m.borrowed;
return { val, eqv, ratio: eqv / m.principal};
}
function liquidateMargin(reason){
const m = G.margin, st = marginStatus();
if (G.limitDown[m.sector] && reason==='force') return false; // 跌停卖不出去，顺延
G.trades.push({ id: m.sector, ki: PRE_DAYS + G.day - 1, t:'S', p: G.prices[m.sector] });
G.cash += Math.max(0, st.eqv); G.margin = null;
flash(`🧨 配资平仓（${reason==='force'?'强制':'主动'}）：仓位清零，拿回 ${fmt(Math.max(0,st.eqv))} 元。`);
return true;
}
function checkMargin(){
if (!G.margin) return;
const st = marginStatus();
if (st.eqv < 0){
/* 穿仓：倒欠配资公司 */
G.debt = -st.eqv; G.cash = 0; G.margin = null;
return gameOver('debt');
}
if (st.ratio <= 0.3){
if (!liquidateMargin('force'))
flash('🧨 平仓线已触发，但跌停封死卖不出去！仓位顺延一天，你的保证金还在往下漏…');
return;
}
if (st.ratio <= 0.5 &&!G.margin.warned){
G.margin.warned = true;
showModal(`<h3>📞 配资公司来电</h3>
<p>老板语气变了：兄弟，你的仓位快到<b>警戒线</b>了。再亏就强平。</p>
<p>两个选择：<b>追加保证金</b>（从现金里转 30% 本金进去，多数人都这么选，然后亏更多），或者<b>现在认赔强平</b>。</p>
<div class="btnrow">
<button class="danger" onclick="topUpMargin()">追加保证金</button>
<button onclick="liquidateMargin('manual');closeModal()">认赔平仓</button>
</div>`);
}
}
function topUpMargin(){
const add = G.margin.principal * 0.3;
if (G.cash >= add){ G.cash -= add; G.margin.borrowed -= add; G.margin.warned = false;
closeModal(); flash('💸 追加保证金打过去了。沉没成本 +1。');
} else { closeModal(); flash('💸 你连追加的钱都凑不出了。');}
}

/* ============ 网贷（上头值爆表时的恶魔低语） ============ */

/* ============ 主流程 ============ */
function startGame(){
clearSave();
const seedInput = document.getElementById('seed-input').value.trim();
const seed = seedInput || ('S' + Math.floor(Math.random()*90000+10000));
const name = document.getElementById('player-name').value.trim() || '无名韭菜';
G = newGame(seed); G.playerName = name;

document.getElementById('game-screen').classList.remove('hidden');
flash(`📻 ${name} 入市。种子 ${seed}（把种子发给朋友，用同一串=同一盘行情）。祝好运——虽然这游戏里好运没什么用。`);
render();
}
function nextDay(){
if (!G || G.over) return;
if (G.day > DAYS) return settle();
const { ev, divMsg, pnl} = advanceDay();
let msg = `📅 第 ${G.day-1} 天收盘`;
msg += pnl >= 0? `，总资产 <span class="up">${fmt(equity())}</span>（+${(pnl*100).toFixed(1)}%）`
: `，总资产 <span class="down">${fmt(equity())}</span>（${(pnl*100).toFixed(1)}%）`;
if (ev) msg += `<br>${ev.text}`;
if (divMsg) msg += `<br>${divMsg}`;
/* 小道消息（30%）：信了就是一次赌博 */
if (rng() < 0.3 && G.day <= DAYS){
const t = pick(SECTORS.filter(s=>s.id!=='bank'));
G.pendingRumor = { target: t.id, trap: rng() < 0.7};
msg += `<br>📩 收到一条小道消息：「${t.name} 有内幕利好，明天必涨！」——<button onclick="believeRumor()">梭一部分跟买</button> <button onclick="ignoreRumor()">当没看见</button>`;
}
flash(msg);
if (G.margin) checkMargin();
if (!G.over && G.day > DAYS) return settle();
if (!G.over && equity() <= 100 && G.cash <= 100) return gameOver('broke');
if (!G.over) maybeLoanOffer();
render();
}
function believeRumor(){
const r = G.pendingRumor; if (!r) return render();
const amt = Math.min(G.cash * 0.5, G.cash);
if (amt >= 100) buy(r.target, amt);
const s = S(r.target);
if (r.trap){ G.prices[r.target] *= 0.92;
flash(`🕳️ 消息是假的！${s.name} 是庄家出货，你刚接盘就跌了 8%。消息，就是用来坑信消息的人的。`);
} else { G.prices[r.target] *= 1.08;
flash(`🎰 消息居然是真的，${s.name} 涨了 8%！别高兴——靠消息赢的钱，最后都靠消息输回去。`);
}
/* 同步更新当日K线 */
const klast = G.ohlc[r.target][G.ohlc[r.target].length-1];
if (klast){ klast.c = G.prices[r.target]; klast.h = Math.max(klast.h, klast.c); klast.l = Math.min(klast.l, klast.c); klast.v *= 2; }
G.histories[r.target].push(G.prices[r.target]);
G.pendingRumor = null; render();
}
function ignoreRumor(){ G.pendingRumor = null; flash('📩 你把小道消息删了。无聊，但保命。'); render();}
</script>
<script>
'use strict';
/* ============ 渲染 ============ */

      </div>`;
    box.appendChild(d);

  });

  /* 交易面板 */

  const buyBtns = document.getElementById('buy-btns'), sellBtns = document.getElementById('sell-btns');
  buyBtns.innerHTML=''; sellBtns.innerHTML='';
  [5000,10000,30000].forEach(a=>{
    const b=document.createElement('button'); b.className='buy'; b.innerText='买 '+fmt(a);
    b.onclick=()=>buy(selected,a); buyBtns.appendChild(b); });
  const bAll=document.createElement('button'); bAll.className='buy'; bAll.innerText='全仓买入';
  bAll.onclick=()=>buy(selected,G.cash); buyBtns.appendChild(bAll);
  [[0.25,'卖 1/4'],[0.5,'卖一半'],[1,'全卖']].forEach(([f,t])=>{
    const b=document.createElement('button'); b.className='sell'; b.innerText=t;
    b.onclick=()=>sell(selected,f); sellBtns.appendChild(b); });
  if (G.margin){
    const b=document.createElement('button'); b.className='danger'; b.innerText='💥 配资强平离场';
    b.onclick=()=>{ liquidateMargin('manual'); render(); }; sellBtns.appendChild(b);
  }

  drawChart();
  saveGame();

/* ============ 存档（localStorage)：被打断回来继续 ============ */
const SAVE_KEY = 'baocang_save_v1';
function saveGame(){
  if (!G || G.over) return;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ G, selected })); } catch(e){}
}
function clearSave(){ try { localStorage.removeItem(SAVE_KEY); } catch(e){} }
function resumeGame(){
  try {
    const raw = localStorage.getItem(SAVE_KEY); if (!raw) return;
    const data = JSON.parse(raw);
    if (!data || !data.G || data.G.over) return;
    G = data.G; selected = data.selected || 'bank'; inspectIdx = -1;
    rng = mulberry32(hashSeed(G.seed + ':resume:' + G.day));   // 续玩从当前位置续随机流
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-screen').classList.remove('hidden');
    flash(`▶️ 欢迎回来，${G.playerName || '玩家'}。第 ${G.day} 天继续——上次你停在的，就是现在。`);
    render();
  } catch(e){}
}
(function checkSave(){
  try {
    const raw = localStorage.getItem(SAVE_KEY); if (!raw) return;
    const d = JSON.parse(raw);
    if (d && d.G && !d.G.over){
      const b = document.getElementById('resume-btn');
      if (b){ b.classList.remove('hidden');
        b.innerText = `▶️ 继续上次对局（第 ${Math.min(d.G.day, DAYS)} 天 · ${d.G.playerName || '玩家'}）`; }
    }
  } catch(e){}
})();

/* ============ 迷你走势图 sparkline（渐变填充+基准虚线，苹果股市风） ============ */
function drawSpark(cv, s){
  const ctx = cv.getContext('2d'), W = cv.width, H = cv.height;
  const data = G.ohlc[s.id].map(k=>k.c);
  if (data.length < 2) return;
  const min = Math.min(...data), max = Math.max(...data), rg = (max-min)||1;
  const base = data[0];
  const up = data[data.length-1] >= base;
  const col = up ? '#f44336' : '#26a69a';
  const px = i => 2 + i*(W-4)/(data.length-1);
  const py = v => 6 + (max-v)/rg*(H-16);
  /* 基准虚线（区间起点价位） */
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1; ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(0, py(base)); ctx.lineTo(W, py(base)); ctx.stroke();
  ctx.setLineDash([]);
  /* 走势线 + 渐变填充 */
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, up ? 'rgba(244,67,54,.45)' : 'rgba(38,166,154,.45)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.beginPath();
  data.forEach((v,i)=>{ const x=px(i), y=py(v); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
  ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.lineTo(px(data.length-1), H); ctx.lineTo(px(0), H); ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();
}

/* ============ K线图（蜡烛+影线+成交量，红涨绿跌） ============ */
function drawChart(){
  const cv = document.getElementById('chart'), ctx = cv.getContext('2d');
  const W = cv.width = cv.offsetWidth * 2, H = cv.height = 520;
  cv.style.height = '260px';
  ctx.fillStyle = '#0d1015'; ctx.fillRect(0,0,W,H);
  const s = S(selected), data = G.ohlc[selected];
  document.getElementById('chart-name').innerText = s.name + ' · 日K';
  const chg = G.lastChange[selected] || 0;
  const el = document.getElementById('chart-pct');
  el.innerText = `今日 ${(chg*100).toFixed(1)}% · 热度 ${Math.round(G.heat[selected])}`;
  el.className = 'pc ' + (chg>0.0005?'up':(chg<-0.0005?'down':'flat'));
  ctx.font = '20px sans-serif';
  if (!data.length){ ctx.fillStyle='#9aa0aa'; ctx.fillText('开盘后生成K线', 30, 60); return; }
  const n = data.length;
  let max = -1e18, min = 1e18;
  data.forEach(k=>{ max = Math.max(max,k.h); min = Math.min(min,k.l); });
  const pad = (max-min)*0.08 || 1; max += pad; min -= pad;
  const plotH = H*0.58, volH = H*0.11, topPad = 96;
  const px = i => 30 + i*((W-120)/Math.max(1, n-1));
  const py = v => topPad + (max-v)/(max-min)*plotH;
  /* 网格线 + 右侧价格轴 */
  for (let g=0; g<=4; g++){
    const v = max - (max-min)*g/4, y = py(v);
    ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(30,y); ctx.lineTo(W-90,y); ctx.stroke();
    ctx.fillStyle = '#9aa0aa'; ctx.fillText(v.toFixed(1), W-84, y+7);
  }
  const volMax = Math.max(...data.map(k=>k.v)) || 1;
  const cw = Math.max(4, (W-120)/Math.max(1,n) * 0.55);
  /* 蜡烛 + 成交量 */
  data.forEach((k,i)=>{
    const up = k.c >= k.o, col = up ? '#f44336' : '#26a69a';
    const x = px(i);
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, py(k.h)); ctx.lineTo(x, py(k.l)); ctx.stroke();  // 影线
    const yO = py(k.o), yC = py(k.c);
    ctx.fillRect(x-cw/2, Math.min(yO,yC), cw, Math.max(3, Math.abs(yO-yC)));        // 实体
    const vh = k.v/volMax*volH, vyTop = topPad + plotH + 28;
    ctx.globalAlpha = 0.55;
    ctx.fillRect(x-cw/2, vyTop + volH - vh, cw, vh);
    ctx.globalAlpha = 1;
  });
  chartGeom = { W, n };
  /* MA5 / MA10 均线 */
  const closes = data.map(k=>k.c);
  const ma = (per)=> closes.map((_,i)=> i<per-1 ? null : closes.slice(i-per+1, i+1).reduce((a,b)=>a+b,0)/per);
  [['MA5', ma(5), '#ffd54f'], ['MA10', ma(10), '#ce93d8']].forEach(([nm, arr, col], li)=>{
    ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath();
    let started = false;
    arr.forEach((v,i)=>{ if (v===null) return; const x=px(i), y=py(v); started?ctx.lineTo(x,y):ctx.moveTo(x,y); started=true; });
    ctx.stroke();
    const lastV = [...arr].reverse().find(v=>v!==null);
    ctx.fillStyle = col; ctx.font = '18px sans-serif';
    ctx.fillText(`${nm} ${lastV?lastV.toFixed(1):'--'}`, W-360+li*130, 64);
  });
  /* 持仓成本线 */
  const hd = G.hold[selected];
  if (hd.shares > 0.01 && hd.avgCost > 0){
    const y = py(hd.avgCost);
    ctx.strokeStyle = '#f0b90b'; ctx.lineWidth = 2; ctx.setLineDash([8,6]);
    ctx.beginPath(); ctx.moveTo(30, y); ctx.lineTo(W-90, y); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#f0b90b'; ctx.font = 'bold 18px sans-serif';
    ctx.fillText(`你的成本 ${hd.avgCost.toFixed(1)}`, 34, y-8);
  }
  /* 买卖点标记 B / S */
  (G.trades || []).filter(t=>t.id===selected).forEach(t=>{
    const ki = Math.max(0, Math.min(n-1, t.ki));
    const x = px(t.ki < n ? t.ki : n-1), k = data[ki];
    const isB = t.t === 'B';
    const y = isB ? py(k.l) + 24 : py(k.h) - 24;
    ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI*2);
    ctx.fillStyle = isB ? '#d32f2f' : '#1d9e75'; ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(t.t, x, y+6); ctx.textAlign = 'left';
  });
  /* 点按查看：选中K线的信息 */
  if (inspectIdx >= 0 && inspectIdx < n){
    const k = data[inspectIdx], x = px(inspectIdx);
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1; ctx.setLineDash([5,5]);
    ctx.beginPath(); ctx.moveTo(x, topPad); ctx.lineTo(x, topPad+plotH+volH+28); ctx.stroke(); ctx.setLineDash([]);
    const prev = inspectIdx > 0 ? data[inspectIdx-1].c : k.o;
    const chgp = (k.c - prev)/prev * 100;
    const dayTxt = inspectIdx >= PRE_DAYS ? `第${inspectIdx-PRE_DAYS+1}天` : `历史第${inspectIdx+1}天`;
    ctx.font = '18px sans-serif';
    const info = `${dayTxt} 开${k.o.toFixed(1)} 高${k.h.toFixed(1)} 低${k.l.toFixed(1)} 收${k.c.toFixed(1)} ${chgp>=0?'+':''}${chgp.toFixed(1)}%`;
    const tw = ctx.measureText(info).width;
    ctx.fillStyle = 'rgba(20,24,32,.92)'; ctx.fillRect(24, 72, tw+20, 30);
    ctx.fillStyle = '#fff'; ctx.fillText(info, 34, 94);
  }
  /* 底部日期轴：左侧为开局前约3个月历史，右侧为游戏天数 */
  ctx.fillStyle = '#9aa0aa';
  for (let i=PRE_DAYS; i<n; i+=5) ctx.fillText('D'+(i-PRE_DAYS+1), px(i)-10, H-14);
  ctx.fillStyle = '#6b7280';
  ctx.fillText('← 过去3个月历史', 30, H-14);
  if (n > PRE_DAYS){
    ctx.strokeStyle = 'rgba(240,185,11,.5)'; ctx.lineWidth = 1; ctx.setLineDash([5,5]);
    ctx.beginPath(); ctx.moveTo(px(PRE_DAYS-1)+((px(PRE_DAYS)-px(PRE_DAYS-1))/2), topPad); ctx.lineTo(px(PRE_DAYS-1)+((px(PRE_DAYS)-px(PRE_DAYS-1))/2), topPad+plotH); ctx.stroke();
    ctx.setLineDash([]);
  }
  const kLast = data[n-1];
  ctx.fillStyle = '#e8e8e8'; ctx.font = 'bold 20px sans-serif';
  ctx.fillText(`开${kLast.o.toFixed(1)} 高${kLast.h.toFixed(1)} 低${kLast.l.toFixed(1)} 收${kLast.c.toFixed(1)}`, 30, 34);
  ctx.font = '18px sans-serif'; ctx.fillStyle = '#6b7280';
  ctx.fillText('成交量（相对）', 30, topPad + plotH + 20);
  if (G.limitDown[selected]){ ctx.fillStyle='#26a69a'; ctx.font='bold 22px sans-serif';
    ctx.fillText('🧊 跌停封死 · 卖不出去', 30, 64); }
}

function drawSettleChart(){
  const cv = document.getElementById('settle-chart'); if (!cv) return;
  const ctx = cv.getContext('2d');
  const W = cv.width = cv.offsetWidth*2, H = cv.height = 320;
  ctx.fillStyle='#0d1015'; ctx.fillRect(0,0,W,H);
  const lines = [
    { d:G.equityHist, c:'#f0b90b', n:'你的资金' },
    { d:G.lieHist,    c:'#4caf50', n:'躺平线（银行红利持有不动）' },
  ];
  lines[0].d.push(equity());
  const empty = lines[0].d.map(()=>100000);
  const all = [...lines[0].d, ...lines[1].d];
  const min = Math.min(...all)*0.98, max = Math.max(...all)*1.02, rg = (max-min)||1;
  const px = i => 20 + i*(W-40)/29, py = v => H-20-(v-min)/rg*(H-50);
  ctx.fillStyle='#9aa0aa'; ctx.font='18px sans-serif';
  ctx.fillText('10万（空仓线）', 24, py(100000)-8);
  ctx.setLineDash([8,6]); ctx.strokeStyle='#555'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,py(100000)); ctx.lineTo(W,py(100000)); ctx.stroke(); ctx.setLineDash([]);
  lines.forEach(L=>{
    ctx.strokeStyle=L.c; ctx.lineWidth=3; ctx.beginPath();
    L.d.forEach((v,i)=>{ const x=px(i),y=py(v); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
    ctx.stroke(); ctx.fillStyle=L.c; ctx.fillText(L.n, 24, py(L.d[L.d.length-1]) + (L.n.includes('躺平')?-24:14));
  });
}

/* ============ 结算与结局 ============ */
function gameOver(kind){
  G.over = true; clearSave();
  const eq = equity();
  let html = '';
  if (kind === 'debt'){
    html = `<h3>💀 结局：穿仓负债</h3>
      <div class="poster"><div>你在配资公司签下的单子，把你送到了这里</div>
      <div class="big">倒欠 ${fmt(G.debt)} 元</div>
      <div>第 ${G.day} 天，跌停板封死了逃生通道。</div></div>
      <p>配资公司老板的电话还在响。现实里，很多人不是输光了本金就不玩了——<b>他们是输了本金，又去借，借了再亏，最后连"不玩了"的资格都没有。</b></p>
      <p>🎓 戒赌课第1课：<b>杠杆不会放大你的运气，只会放大你的结局。</b>10倍杠杆下，一个跌停就够了。</p>`;
  } else {
    html = `<h3>💥 结局：爆仓</h3>
      <div class="poster"><div>${G.playerName} 的30天</div>
      <div class="big">10万 → ${fmt(eq)}</div>
      <div>第 ${G.day} 天，账户见底。</div></div>
      <p>你上头的时候按下的每一个按钮，手续费都替你记着账。复盘看看：<b>如果第一天全仓银行红利躺平不动，现在是 ${fmt(G.lieCash + G.lieShares*G.prices.bank)}。</b></p>
      <p>🎓 戒赌课第2课：<b>你输给的不是市场，是你自己的手。</b></p>`;
  }
  showModal(html + endButtons(kind));
}
function settle(){
  G.over = true; clearSave();
  const eq = equity() - G.debt, lie = G.lieCash + G.lieShares*G.prices.bank;
  let verdict, cls;
  if (eq > lie && eq >= 100000){ verdict='🏆 活下来了，还跑赢了躺平。你是万中无一的冷静派。'; cls='up'; }
  else if (eq >= 100000){ verdict='😐 保住本金，但跑输了躺平线——折腾了一整月，不如第一天买完就删软件。'; cls='flat'; }
  else { verdict='📉 30天，你的资金缩水到 '+fmt(eq)+'。躺平线是 '+fmt(lie)+'。'; cls='down'; }
  const ach = [];
  if (G.marginOpens===0) ach.push('🧘 从未碰杠杆');
  if (G.loanRefused) ach.push('🛡️ 拒绝网贷');
  if (G.emptyDays>=10) ach.push('🪨 空仓'+G.emptyDays+'天');
  if (eq>=200000) ach.push('🚀 资金翻倍（欧皇）');
  ach.push('🎮 活过30天');
  showModal(`<h3>📊 30天结算</h3>
    <canvas id="settle-chart" style="height:160px"></canvas>
    <p>你的终点：<b class="${cls}">${fmt(eq)}</b> 元</p>
    <p>躺平线：${fmt(lie)} 元 ｜ 空仓线：100,000 元</p>
    <p>${verdict}</p>
    <p>手续费总共吃掉你多少钱，自己算算——<b>频繁交易就是给市场交税</b>。</p>
    <p>🎓 戒赌课第3课：<b>跷跷板从不缺席，你每次都坐在下去的那头。</b>少看盘、少动手，是散户唯一的护城河。</p>
    <div>${ach.map(a=>`<span class="achieve">${a}</span>`).join('')}</div>
    <div class="poster"><div class="big">种子 ${G.seed}</div>
      <div>把种子发给朋友，同一盘行情比谁活得久——输的请奶茶 🧋</div></div>
    ${endButtons('settle')}`);
  drawSettleChart();
}
function endButtons(kind){
  return `<div class="btnrow"><button class="primary" onclick="restart()">🔄 再来一局</button>
    <button onclick="showPoster('${kind}')">📸 战绩海报</button>
    <button onclick="location.reload()">🏠 回首页</button></div>`;
}

/* ============ 战绩海报（导出图片，朋友圈/群聊传播） ============ */
function wrapText(ctx, text, x, y, maxW, lineH){
  let line = '', yy = y;
  for (const ch of text){
    const t = line + ch;
    if (ctx.measureText(t).width > maxW && line){ ctx.fillText(line, x, yy); line = ch; yy += lineH; }
    else line = t;
  }
  if (line) ctx.fillText(line, x, yy);
  return yy;
}
function showPoster(kind){
  const PW = 750, PH = 1150;
  const cv = document.createElement('canvas'); cv.width = PW; cv.height = PH;
  const ctx = cv.getContext('2d');
  /* 背景 */
  const bg = ctx.createLinearGradient(0, 0, 0, PH);
  bg.addColorStop(0, '#1a1410'); bg.addColorStop(1, '#0d1015');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, PW, PH);
  ctx.strokeStyle = '#f0b90b'; ctx.lineWidth = 6; ctx.strokeRect(12, 12, PW-24, PH-24);
  let y = 80;
  ctx.fillStyle = '#f0b90b'; ctx.font = 'bold 52px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('💥 爆仓模拟器', PW/2, y); y += 48;
  ctx.fillStyle = '#9aa0aa'; ctx.font = '26px sans-serif';
  ctx.fillText(`${G.playerName || '无名韭菜'} 的30天战绩`, PW/2, y); y += 44;
  ctx.fillStyle = '#6b7280'; ctx.font = '24px sans-serif';
  ctx.fillText(`行情种子 ${G.seed} · 同一串种子 = 同一盘行情`, PW/2, y); y += 66;
  /* 大结局数字 */
  ctx.textAlign = 'left';
  let bigTxt, subTxt, verdict;
  if (kind === 'debt'){
    bigTxt = `💀 穿仓负债 倒欠 ${fmt(G.debt)} 元`; subTxt = `第 ${G.day} 天 · 跌停封死，逃生无门`;
    verdict = '戒赌课第1课：杠杆不会放大你的运气，只会放大你的结局。10倍杠杆下，一个跌停就够了。';
  } else if (kind === 'broke'){
    bigTxt = `💥 10万 → ${fmt(equity())}`; subTxt = `第 ${G.day} 天 · 账户见底`;
    verdict = '戒赌课第2课：你输给的不是市场，是你自己的手。手续费替你记得每一笔上头。';
  } else {
    const eq = equity() - G.debt, lie = G.lieCash + G.lieShares*G.prices.bank;
    const r = ((eq/100000)-1)*100;
    bigTxt = `终局 ${fmt(eq)} 元（${r>=0?'+':''}${r.toFixed(1)}%）`; subTxt = `躺平线 ${fmt(lie)} 元`;
    verdict = eq > lie && eq >= 100000 ? '🏆 跑赢了躺平线！你是万中无一的冷静派。'
      : eq >= 100000 ? '😐 保住本金但跑输躺平：折腾一整月，不如第一天买完就删软件。'
      : '📉 少看盘、少动手，是散户唯一的护城河。';
  }
  ctx.fillStyle = '#f44336'; ctx.font = 'bold 38px sans-serif';
  ctx.fillText(bigTxt, 50, y); y += 40;
  ctx.fillStyle = '#9aa0aa'; ctx.font = '26px sans-serif';
  ctx.fillText(subTxt, 50, y); y += 56;
  /* 资金曲线面板 */
  const hist = [...G.equityHist, equity()];
  const cx = 50, cw = PW-100, chh = 240, cy = y;
  ctx.fillStyle = '#0d1015'; ctx.fillRect(cx, cy, cw, chh);
  const mn = Math.min(...hist, 100000)*0.99, mx = Math.max(...hist, 100000)*1.01;
  const pxx = i => cx + 10 + i*(cw-20)/Math.max(1, hist.length-1);
  const pyy = v => cy + chh - 14 - (v-mn)/Math.max(1,(mx-mn))*(chh-28);
  ctx.setLineDash([6,6]); ctx.strokeStyle = '#555'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx+10, pyy(100000)); ctx.lineTo(cx+cw-10, pyy(100000)); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle = '#f0b90b'; ctx.lineWidth = 5; ctx.beginPath();
  hist.forEach((v,i)=>{ const x=pxx(i), yy=pyy(v); i?ctx.lineTo(x,yy):ctx.moveTo(x,yy); });
  ctx.stroke();
  ctx.fillStyle = '#9aa0aa'; ctx.font = '22px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('你的资金曲线（金线） · 灰虚线 = 10万本金', cx+10, cy+chh-8);
  y = cy + chh + 56;
  /* verdict */
  ctx.fillStyle = '#e8e8e8'; ctx.font = '26px sans-serif';
  y = wrapText(ctx, verdict, 50, y, PW-100, 40) + 52;
  /* 成就 */
  if (kind === 'settle'){
    const eq = equity() - G.debt, ach = [];
    if (G.marginOpens===0) ach.push('🧘从未碰杠杆');
    if (G.loanRefused) ach.push('🛡️拒绝网贷');
    if (G.emptyDays>=10) ach.push('🪨空仓'+G.emptyDays+'天');
    if (eq>=200000) ach.push('🚀资金翻倍');
    ach.push('🎮活过30天');
    ctx.fillStyle = '#f0b90b'; ctx.font = '24px sans-serif';
    ctx.fillText(ach.join('  '), 50, y); y += 48;
  }
  /* 页脚 */
  ctx.fillStyle = '#6b7280'; ctx.font = '23px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('不靠说教戒赌，让你亲手爆仓一次', PW/2, PH-110);
  ctx.fillStyle = '#4a90d9';
  ctx.fillText('zhongj1n.github.io/BaoCang-Simulator', PW/2, PH-70);
  ctx.textAlign = 'left';
  /* 长按保存 */
  const url = cv.toDataURL('image/png');
  showModal(`<h3>📸 战绩海报</h3>
    <img src="${url}" style="width:100%;border-radius:8px;border:1px solid #2a2f3a">
    <p style="color:#9aa0aa;font-size:13px">📱 长按图片 → 保存/转发到朋友圈和群聊。把种子发给朋友，同盘比谁活得久。</p>
    <div class="btnrow"><button class="primary" onclick="closeModal()">关闭</button></div>`);
}
function restart(){
  const seed = 'S' + Math.floor(Math.random()*90000+10000);
  document.getElementById('seed-input').value = seed;
  document.getElementById('modal-root').innerHTML='';
  startGame();
}
window.addEventListener('resize', ()=>{ if (G) drawChart(); });
/* 点按K线图：查看单根蜡烛（再点同一根取消） */
document.getElementById('chart').addEventListener('click', e=>{
  if (!G || !chartGeom) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (chartGeom.W / rect.width);
  const step = (chartGeom.W - 120) / Math.max(1, chartGeom.n - 1);
  let idx = Math.round((x - 30) / step);
  idx = Math.max(0, Math.min(chartGeom.n - 1, idx));
  inspectIdx = (idx === inspectIdx) ? -1 : idx;
  drawChart();
});
</script>
